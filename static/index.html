<!DOCTYPE html>
<html>

<head>
    <title>YouTube RAG Demo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4e8f0);
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.6s ease-in-out;
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            font-weight: 600;
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            transition: border 0.2s ease;
        }

        select:focus,
        textarea:focus {
            border: 1px solid #111;
            outline: none;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            margin-top: 20px;
            padding: 12px 22px;
            font-size: 14px;
            border-radius: 8px;
            border: none;
            background-color: #111;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #333;
            transform: translateY(-1px);
        }

        .answer-box {
            margin-top: 35px;
            padding: 25px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #ddd;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }

        .answer-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .error {
            border-left: 4px solid #e53935;
            background: #fff5f5;
        }

        .confidence {
            margin-top: 10px;
            font-weight: 600;
        }

        .spinner {
            margin-top: 15px;
            width: 24px;
            height: 24px;
            border: 3px solid #ddd;
            border-top: 3px solid #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        a {
            color: #1a73e8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>YouTube RAG Demo</h1>

        <label>Select Video</label>
        <select id="videoId"></select>

        <label>Question</label>
        <textarea id="question" placeholder="Ask something about the video..."></textarea>

        <button onclick="ask()">Ask</button>

        <div id="loading" style="display:none;">
            <div class="spinner"></div>
        </div>

        <div id="result" class="answer-box"></div>
    </div>

    <script>
        async function loadVideos() {
            const response = await fetch("/videos");
            const videos = await response.json();

            const dropdown = document.getElementById("videoId");

            videos.forEach(video => {
                const option = document.createElement("option");
                option.value = video.video_id;
                option.textContent = video.title;
                dropdown.appendChild(option);
            });
        }

        async function ask() {
            const videoId = document.getElementById("videoId").value;
            const question = document.getElementById("question").value;

            const resultDiv = document.getElementById("result");
            const loadingDiv = document.getElementById("loading");

            resultDiv.classList.remove("visible", "error");
            resultDiv.innerHTML = "";
            loadingDiv.style.display = "block";

            const response = await fetch("/query", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    video_id: videoId,
                    question: question
                })
            });

            const data = await response.json();

            loadingDiv.style.display = "none";

            if (!response.ok) {
                resultDiv.classList.add("error", "visible");
                resultDiv.innerHTML = "Error: " + data.detail;
                resultDiv.scrollIntoView({ behavior: "smooth" });
                return;
            }

            resultDiv.innerHTML = `
        <h3>Answer</h3>
        <p>${data.answer}</p>
        <div class="confidence">Confidence: ${data.confidence}</div>
        <br>
        <a href="${data.top_match.youtube_link}" target="_blank">
            Jump to Timestamp
        </a>
    `;

            resultDiv.classList.add("visible");

            resultDiv.scrollIntoView({ behavior: "smooth" });
        }

        window.onload = loadVideos;
    </script>

</body>

</html>
